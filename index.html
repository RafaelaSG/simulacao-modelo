<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Simulador Hidrogeológico 3D - Com N.A. Dinâmico</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #0b1120; color: #fff; overflow: hidden; }

    #ui-panel {
      position: absolute;
      top: 15px;
      left: 15px;
      background: rgba(15, 23, 42, 0.92);
      padding: 18px;
      border-radius: 12px;
      backdrop-filter: blur(10px);
      z-index: 10;
      width: 320px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    h2 { font-size: 1rem; color: #38bdf8; text-align: center; margin-bottom: 14px; text-transform: uppercase; letter-spacing: 0.5px; }
    .control-group { margin-bottom: 14px; }
    label { font-size: 0.82rem; display: flex; justify-content: space-between; margin-bottom: 6px; color: #cbd5e1; font-weight: 500; }
    input[type=range], select { width: 100%; cursor: pointer; accent-color: #38bdf8; }
    select { padding: 8px; background: #1e293b; color: #fff; border: 1px solid #334155; border-radius: 6px; font-size: 0.85rem; outline: none; }

    .status-badge {
      text-align: center;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.9rem;
      margin-top: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .efluente { background: rgba(16, 185, 129, 0.25); color: #34d399; border: 1px solid #10b981; box-shadow: 0 0 12px rgba(16, 185, 129, 0.3); }
    .influente { background: rgba(245, 158, 11, 0.25); color: #fbbf24; border: 1px solid #f59e0b; box-shadow: 0 0 12px rgba(245, 158, 11, 0.3); }

    #canvas-container { width: 100vw; height: 100vh; }
    .instructions {
      position: absolute;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.8rem;
      color: #94a3b8;
      background: rgba(15, 23, 42, 0.8);
      padding: 6px 16px;
      border-radius: 20px;
      pointer-events: none;
    }
  </style>

  <!-- CDNs do Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="ui-panel">
    <h2>Hidrogeologia 3D</h2>

    <div class="control-group">
      <label>Regime Hidrológico:</label>
      <select id="regime-select">
        <option value="efluente">Rio Efluente (Clima Úmido / Ganhador)</option>
        <option value="influente">Rio Influente (Clima Árido / Perdedor)</option>
      </select>
    </div>

    <div class="control-group">
      <label>Nível d'Água (N.A.): <span id="water-val">8.5 m</span></label>
      <input type="range" id="water-slider" min="0" max="100" value="85">
    </div>

    <div class="control-group">
      <label>Intensidade da Chuva: <span id="rain-val">Forte</span></label>
      <input type="range" id="rain-slider" min="0" max="100" value="70">
    </div>

    <div id="status-tag" class="status-badge efluente">RIO EFLUENTE (Ganhador)</div>
  </div>

  <div class="instructions">🖱️ Arraste para girar | Scroll para zoom | Clique direito para mover</div>
  <div id="canvas-container"></div>

  <script>
    // --- CENA E CÂMERA ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b1120);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(20, 15, 25);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // --- ILUMINAÇÃO ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);

    const sun = new THREE.DirectionalLight(0xffffff, 1.0);
    sun.position.set(25, 40, 20);
    scene.add(sun);

    // --- BLOCO 3D DO TERRENO ---
    const blockWidth = 20;
    const blockDepth = 12;
    const blockHeight = 8;
    const frontZ = blockDepth / 2 + 0.08; // Posição frontal para os elementos do corte

    // 1. Solo com Calha
    const soilGeo = new THREE.BoxGeometry(blockWidth, blockHeight, blockDepth, 60, 1, 1);
    const pos = soilGeo.attributes.position;

    for (let i = 0; i < pos.count; i++) {
      let x = pos.getX(i);
      let y = pos.getY(i);
      if (y > 0) {
        let valley = Math.exp(-Math.pow(x / 3.0, 2)) * 3.0;
        pos.setY(i, y - valley);
      }
    }
    soilGeo.computeVertexNormals();

    const soilMat = new THREE.MeshStandardMaterial({ color: 0x4d7c0f, roughness: 0.8 });
    const soilMesh = new THREE.Mesh(soilGeo, soilMat);
    soilMesh.position.y = blockHeight / 2;
    scene.add(soilMesh);

    // 2. Rocha Impermeável
    const rockGeo = new THREE.BoxGeometry(blockWidth, 1.2, blockDepth);
    const rockMat = new THREE.MeshStandardMaterial({ color: 0x334155 });
    const rockMesh = new THREE.Mesh(rockGeo, rockMat);
    rockMesh.position.y = 0.6;
    scene.add(rockMesh);

    // 3. MESH DO AQUÍFERO (Água Subterrânea)
    const waterGeo = new THREE.BoxGeometry(blockWidth - 0.05, 1, blockDepth - 0.05);
    const waterMat = new THREE.MeshPhysicalMaterial({
      color: 0x0284c7,
      transparent: true,
      opacity: 0.75,
      roughness: 0.1
    });
    const waterMesh = new THREE.Mesh(waterGeo, waterMat);
    waterMesh.position.set(0, 4, 0);
    scene.add(waterMesh);

    // 4. ÁGUA DO RIO
    const riverGeo = new THREE.BoxGeometry(3.5, 0.4, blockDepth + 0.1);
    const riverMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, roughness: 0.2 });
    const riverMesh = new THREE.Mesh(riverGeo, riverMat);
    riverMesh.position.set(0, 5.2, 0);
    scene.add(riverMesh);

    // --- LINHA DINÂMICA DO NÍVEL FREÁTICO (N.A.) ---
    const linePointsCount = 50;
    const lineGeo = new THREE.BufferGeometry();
    const linePositions = new Float32Array(linePointsCount * 3);
    lineGeo.setAttribute('position', new THREE.BufferAttribute(linePositions, 3));

    const lineMat = new THREE.LineDashedMaterial({
      color: 0x38bdf8,
      linewidth: 3,
      scale: 1,
      dashSize: 0.4,
      gapSize: 0.2
    });
    const naLine = new THREE.Line(lineGeo, lineMat);
    scene.add(naLine);

    // --- CHUVA (PARTÍCULAS) ---
    const rainCount = 400;
    const rainGeo = new THREE.BufferGeometry();
    const rainPositions = new Float32Array(rainCount * 3);

    for (let i = 0; i < rainCount * 3; i += 3) {
      rainPositions[i] = (Math.random() - 0.5) * blockWidth;
      rainPositions[i + 1] = 8 + Math.random() * 12;
      rainPositions[i + 2] = (Math.random() - 0.5) * blockDepth;
    }

    rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPositions, 3));
    const rainMat = new THREE.PointsMaterial({ color: 0x7dd3fc, size: 0.2, transparent: true, opacity: 0.8 });
    const rainSystem = new THREE.Points(rainGeo, rainMat);
    scene.add(rainSystem);

    // --- SETAS DINÂMICAS DE FLUXO ---
    const arrowGroup = new THREE.Group();
    scene.add(arrowGroup);
    const arrowData = [];

    function buildArrows() {
      while (arrowGroup.children.length > 0) arrowGroup.remove(arrowGroup.children[0]);
      arrowData.length = 0;

      const isEfluente = regimeSelect.value === 'efluente';
      const arrowColor = isEfluente ? 0x00ff88 : 0xffaa00;
      const xPositions = [-8, -6, -4, -2, 2, 4, 6, 8];

      xPositions.forEach(x => {
        let dir = isEfluente 
          ? new THREE.Vector3(x > 0 ? -0.8 : 0.8, 0.5, 0).normalize()
          : new THREE.Vector3(x > 0 ? 0.8 : -0.8, -0.6, 0).normalize();

        const origin = new THREE.Vector3(x, 3, frontZ);
        const arrowHelper = new THREE.ArrowHelper(dir, origin, 1.8, arrowColor, 0.6, 0.4);
        arrowGroup.add(arrowHelper);

        arrowData.push({ helper: arrowHelper, baseX: x, dir: dir, phase: Math.random() * Math.PI * 2 });
      });
    }

    // --- INTERFACE DE CONTROLE ---
    const regimeSelect = document.getElementById('regime-select');
    const waterSlider = document.getElementById('water-slider');
    const rainSlider = document.getElementById('rain-slider');
    const waterVal = document.getElementById('water-val');
    const rainVal = document.getElementById('rain-val');
    const statusTag = document.getElementById('status-tag');

    function updateState() {
      const isEfluente = regimeSelect.value === 'efluente';

      if (isEfluente) {
        waterSlider.value = 85;
        rainSlider.value = 70;
        soilMat.color.setHex(0x3a5a40);
        statusTag.textContent = 'RIO EFLUENTE (Ganhador)';
        statusTag.className = 'status-badge efluente';
      } else {
        waterSlider.value = 20;
        rainSlider.value = 10;
        soilMat.color.setHex(0xa16207);
        statusTag.textContent = 'RIO INFLUENTE (Perdedor)';
        statusTag.className = 'status-badge influente';
      }

      buildArrows();
    }

    regimeSelect.addEventListener('change', updateState);

    waterSlider.addEventListener('input', () => {
      const val = parseFloat(waterSlider.value);
      waterVal.textContent = `${(1.2 + (val / 100) * 4.0).toFixed(1)} m`;

      if (val > 50 && regimeSelect.value !== 'efluente') {
        regimeSelect.value = 'efluente';
        updateState();
      } else if (val <= 50 && regimeSelect.value !== 'influente') {
        regimeSelect.value = 'influente';
        updateState();
      }
    });

    rainSlider.addEventListener('input', () => {
      const val = parseFloat(rainSlider.value);
      rainVal.textContent = val === 0 ? 'Sem Chuva' : (val < 50 ? 'Fraca' : 'Forte');
    });

    updateState();

    // --- LOOP DE ANIMAÇÃO ---
    let time = 0;
    function animate() {
      requestAnimationFrame(animate);
      time += 0.03;

      const wVal = parseFloat(waterSlider.value);
      const isEfluente = regimeSelect.value === 'efluente';

      // 1. Atualização do Aquífero 3D
      const targetY = 1.2 + (wVal / 100) * 4.0;
      waterMesh.position.y = targetY / 2 + 0.6;
      waterMesh.scale.y = targetY;

      // 2. Atualização Dinâmica da Curva do Nível Freático (N.A.)
      const positions = naLine.geometry.attributes.position.array;
      const riverLevel = 5.2;

      for (let i = 0; i < linePointsCount; i++) {
        const percent = i / (linePointsCount - 1);
        const x = -blockWidth / 2 + percent * blockWidth;
        
        // Equação de caimento dinâmico da superfície piezométrica em direção ao rio
        let y;
        if (isEfluente) {
          // Curva convexa em direção ao rio (N.A. mais alto nas bordas)
          y = riverLevel + (targetY - 1.2) * (1 - Math.exp(-Math.pow(x / 4.0, 2)));
        } else {
          // Curva côncava (N.A. rebaixado nas bordas, se alimentando do rio)
          y = targetY + (riverLevel - targetY) * Math.exp(-Math.pow(x / 2.5, 2));
        }

        positions[i * 3] = x;
        positions[i * 3 + 1] = y;
        positions[i * 3 + 2] = frontZ;
      }
      naLine.geometry.attributes.position.needsUpdate = true;
      naLine.computeLineDistances(); // Atualiza os traços da linha tracejada

      // 3. Animação da Chuva
      const rainIntensity = parseFloat(rainSlider.value) / 100;
      rainSystem.visible = rainIntensity > 0;
      if (rainIntensity > 0) {
        const p = rainGeo.attributes.position.array;
        for (let i = 1; i < rainCount * 3; i += 3) {
          p[i] -= 0.25 * (0.5 + rainIntensity);
          if (p[i] < 1.2) p[i] = 10 + Math.random() * 5;
        }
        rainGeo.attributes.position.needsUpdate = true;
      }

      // 4. Animação das Setas
      arrowData.forEach(item => {
        const currentY = isEfluente ? targetY * 0.75 : 4.8;
        const offset = Math.sin(time + item.phase) * 0.3;
        item.helper.position.set(item.baseX + item.dir.x * offset, currentY + item.dir.y * offset, frontZ);
      });

      controls.update();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
